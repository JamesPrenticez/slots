name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          #- stage
          #- prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SLOTS_S3_BUCKET: ${{ vars.SLOTS_S3_BUCKET }}
  S3_PREFIX: ${{ vars.S3_PREFIX }}
  SLOTS_INSTANCE_ID: ${{ vars.SLOTS_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create artifact
        run: |
          tar -czf release.tar.gz dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SLOTS_AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set version
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Upload release
        run: |
          aws s3 cp release.tar.gz \
            s3://${SLOTS_S3_BUCKET}/${S3_PREFIX}/${SHORT_SHA}/release.tar.gz

      - name: Deploy to EC2
        env:
          COMMIT: ${{ github.sha }}
          SLOTS_INSTANCE_ID: ${{ vars.SLOTS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          SHORT_SHA=${COMMIT::8}

          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$SLOTS_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters commands="sudo -u ubuntu /home/ubuntu/slot-framework/deploy.sh ${SHORT_SHA}" --query "Command.CommandId" \
          --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for completion, but don't fail here—we want to fetch the logs.
          aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$SLOTS_INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$SLOTS_INSTANCE_ID" \
          --output json)

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.Status')

          echo "Status: $STATUS"

          echo "===== STDOUT ====="
          echo "$RESULT" | jq -r '.StandardOutputContent'

          echo "===== STDERR ====="
          echo "$RESULT" | jq -r '.StandardErrorContent'

          test "$STATUS" = "Success"
